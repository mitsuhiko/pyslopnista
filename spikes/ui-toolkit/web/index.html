<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>UI toolkit playground</title>
<link rel="stylesheet" href="ui.css">
<style>
  :root { color-scheme: light dark; font: 14px -apple-system, system-ui, sans-serif; }
  body { margin: 0; padding: env(safe-area-inset-top) 10px 10px; display: flex; flex-direction: column; height: 100dvh; box-sizing: border-box; gap: 8px; }
  .bar { display: flex; gap: 8px; align-items: center; }
  select, button { font: inherit; padding: 6px 12px; border-radius: 8px; border: 0; }
  button { background: #0a84ff; color: #fff; }
  button.secondary, select { background: #8884; color: inherit; }
  #status { margin-left: auto; opacity: 0.6; font-size: 12px; }
  textarea { flex: 1; font: 13px ui-monospace, monospace; padding: 8px; border-radius: 8px; border: 1px solid #8884; resize: none; }
  pre { height: 22%; overflow: auto; margin: 0; padding: 8px; border-radius: 8px; background: #8881; font: 12px ui-monospace, monospace; white-space: pre-wrap; }
  .stderr { color: #ff453a; } .system { opacity: 0.5; }
  #app { position: fixed; inset: 0; overflow: auto; padding-top: env(safe-area-inset-top); display: none; z-index: 10; }
  #app.open { display: block; }
  #close { position: fixed; top: calc(env(safe-area-inset-top) + 8px); right: 12px; z-index: 11; display: none;
           background: #8886; color: #fff; border-radius: 16px; padding: 4px 12px; backdrop-filter: blur(10px); }
  #app.open ~ #close { display: block; }
</style>
<div class="bar">
  <select id="example"></select>
  <button id="run">Run</button>
  <button id="stop" class="secondary">Stop</button>
  <span id="status">booting...</span>
</div>
<textarea id="code" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>
<pre id="out"></pre>
<div id="app" class="ui-root"></div>
<button id="close">Done</button>
<script src="../sab-polyfill.js"></script>
<script type="module" src="playground.js"></script>
